<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - HiTech Informática</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black font-sans h-screen flex items-center justify-center border-t-8 border-b-8 border-orange-500 px-4">
    <div class="bg-white p-8 rounded-xl shadow-2xl max-w-sm w-full border border-gray-200">
        <div class="text-center mb-8">
            <img src="hitech_ponto.jpg" alt="HiTech Logo" class="h-16 mx-auto mb-4 rounded-lg object-contain shadow-sm border border-gray-100" onerror="this.style.display='none'">
            <h1 class="text-xl font-bold text-gray-800 uppercase tracking-wide">HiTech Informática</h1>
            <p class="text-[10px] font-bold text-orange-600 mt-1 uppercase tracking-widest">Acesso Restrito</p>
        </div>
        <form id="formLogin" class="space-y-5">
            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase mb-1.5">E-mail</label>
                <input type="email" id="email" required class="w-full p-3 border-2 rounded-lg bg-gray-50 outline-none focus:bg-white focus:border-orange-500 transition text-sm">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase mb-1.5">Senha</label>
                <input type="password" id="senha" required class="w-full p-3 border-2 rounded-lg bg-gray-50 outline-none focus:bg-white focus:border-orange-500 transition text-sm">
            </div>
            <div id="msgErro" class="text-red-600 text-xs font-bold hidden text-center bg-red-50 p-2 rounded"></div>
            <button type="submit" id="btnEntrar" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 rounded-lg uppercase transition shadow-lg cursor-pointer">
                Entrar no Sistema
            </button>
        </form>
    </div>
    <script type="module" src="login.js"></script>
</body>
</html>

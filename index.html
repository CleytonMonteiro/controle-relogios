<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Relógios na Assistência</title>
    <!-- Tailwind CSS para design responsivo -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

    <div class="container mx-auto p-4 max-w-full">
        <!-- Cabeçalho -->
        <header class="flex flex-col md:flex-row justify-between items-center mb-6 bg-white p-4 rounded-lg shadow gap-4">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">Controle de Relógios - Assistência</h1>
                <p class="text-sm text-gray-500 mt-1">OS Ativas em Andamento: <span id="contadorAtivas" class="font-bold text-blue-600 bg-blue-50 px-2 py-0.5 rounded">0</span></p>
            </div>
            <button onclick="abrirModal()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition w-full md:w-auto">
                + Nova OS
            </button>
        </header>

        <!-- Abas de Navegação e Busca -->
        <div class="mb-6 flex flex-col md:flex-row justify-between items-center gap-4 bg-white p-4 rounded-lg shadow">
            <div class="flex gap-2 w-full md:w-auto overflow-x-auto pb-2 md:pb-0">
                <button id="btnAbaAtivas" onclick="mudarAba('ANDAMENTO')" class="flex-1 md:flex-none px-3 py-2 rounded-lg font-semibold text-sm transition bg-blue-600 text-white whitespace-nowrap">
                    Em Andamento
                </button>
                <button id="btnAbaAguardando" onclick="mudarAba('AGUARDANDO')" class="flex-1 md:flex-none px-3 py-2 rounded-lg font-semibold text-sm transition bg-gray-200 text-gray-700 hover:bg-gray-300 whitespace-nowrap">
                    Aguardando
                </button>
                <button id="btnAbaEnviado" onclick="mudarAba('ENVIADO')" class="flex-1 md:flex-none px-3 py-2 rounded-lg font-semibold text-sm transition bg-gray-200 text-gray-700 hover:bg-gray-300 whitespace-nowrap">
                    Enviado
                </button>
                <button id="btnAbaFinalizadas" onclick="mudarAba('FINALIZADO')" class="flex-1 md:flex-none px-3 py-2 rounded-lg font-semibold text-sm transition bg-gray-200 text-gray-700 hover:bg-gray-300 whitespace-nowrap">
                    Finalizados
                </button>
            </div>
            <div class="w-full md:w-80">
                <input type="text" id="inputBusca" placeholder="Pesquisar por Empresa, OS, Serial ou Contato..." onkeyup="filtrarDados()" class="w-full p-2 border rounded-lg bg-white text-sm">
            </div>
        </div>

        <!-- Tabela (Visível apenas em Desktop/Tablets largos) -->
        <div class="bg-white rounded-lg shadow overflow-hidden hidden md:block">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200 text-xs">
                    <thead class="bg-gray-50 text-gray-700 uppercase">
                        <tr>
                            <th class="px-3 py-3 text-left">Empresa</th>
                            <th class="px-3 py-3 text-left">Contato</th>
                            <th class="px-3 py-3 text-left">Nº OS</th>
                            <th class="px-3 py-3 text-left">Serial</th>
                            <th class="px-3 py-3 text-left">Modelo</th>
                            <th class="px-3 py-3 text-left">Defeito</th>
                            <th class="px-3 py-3 text-left">Diagnóstico</th>
                            <th class="px-3 py-3 text-left">Entrada</th>
                            <th class="px-3 py-3 text-center">Dias Úteis</th>
                            <th class="px-3 py-3 text-center">Prazo</th>
                            <th class="px-3 py-3 text-center">Status</th>
                            <th class="px-3 py-3 text-left">Observações</th>
                            <th class="px-3 py-3 text-center">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaCorpo" class="divide-y divide-gray-200 text-gray-600">
                        <!-- Dados carregados via JS -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Cards (Visível em Celulares e Telas Pequenas) -->
        <div id="cardsMobile" class="grid grid-cols-1 gap-4 md:hidden">
            <!-- Cards carregados via JS -->
        </div>
    </div>

    <!-- Modal de Cadastro / Edição -->
    <div id="modalOS" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-lg max-w-xl w-full p-6 shadow-xl max-h-[90vh] overflow-y-auto">
            <h2 id="modalTitulo" class="text-xl font-bold text-gray-800 mb-4">Nova Ordem de Serviço</h2>
            <form id="formOS" onsubmit="salvarOS(event)" class="space-y-4">
                <input type="hidden" id="osId">
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold uppercase text-gray-600 mb-1">Empresa</label>
                        <input type="text" id="empresa" required class="w-full p-2 border rounded-lg text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-gray-600 mb-1">Contato</label>
                        <input type="text" id="contato" class="w-full p-2 border rounded-lg text-sm">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-bold uppercase text-gray-600 mb-1">Nº OS</label>
                        <input type="text" id="numOs" required class="w-full p-2 border rounded-lg text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-gray-600 mb-1">Serial</label>
                        <input type="text" id="serial" required class="w-full p-2 border rounded-lg text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-gray-600 mb-1">Modelo</label>
                        <select id="modelo" required class="w-full p-2 border rounded-lg bg-white text-sm">
                            <option value="">Selecione</option>
                            <option value="IDCLASS">IDCLASS</option>
                            <option value="IDFACE">IDFACE</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold uppercase text-gray-600 mb-1">Defeito Relatado</label>
                        <textarea id="defeito" rows="2" class="w-full p-2 border rounded-lg text-sm"></textarea>
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-gray-600 mb-1">Diagnóstico</label>
                        <textarea id="diagnostico" rows="2" class="w-full p-2 border rounded-lg text-sm"></textarea>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-bold uppercase text-gray-600 mb-1">Data de Entrada</label>
                        <input type="date" id="dataEntrada" required class="w-full p-2 border rounded-lg text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-gray-600 mb-1">Status</label>
                        <select id="status" class="w-full p-2 border rounded-lg bg-white text-sm">
                            <option value="ANDAMENTO">Em Andamento</option>
                            <option value="AGUARDANDO">Aguardando</option>
                            <option value="ENVIADO">Enviado</option>
                            <option value="FINALIZADO">Finalizado</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-gray-600 mb-1">Observações</label>
                        <input type="text" id="observacao" class="w-full p-2 border rounded-lg text-sm">
                    </div>
                </div>

                <div class="flex justify-end gap-2 pt-4 border-t">
                    <button type="button" onclick="fecharModal()" class="px-4 py-2 border rounded-lg text-gray-600 hover:bg-gray-50 text-sm">Cancelar</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 text-sm">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script de Integração Firebase e Lógica -->
    <script type="module" src="app.js"></script>
</body>
</html>

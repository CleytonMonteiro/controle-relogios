<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Relógios na Assistência - HiTech Informática</title>
    <!-- Tailwind CSS para design responsivo -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Estilo exclusivo para quando mandar imprimir a etiqueta da OS */
        @media print {
            body * {
                visibility: hidden;
            }
            #etiquetaImpressao, #etiquetaImpressao * {
                visibility: visible;
            }
            #etiquetaImpressao {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                padding: 10px;
                font-family: monospace;
                color: #000;
                background: #fff;
            }
        }
    </style>
</head>
<body class="bg-gray-100 font-sans">

    <!-- Tela de Abertura / Apresentação (Paleta HiTech: Preto Grafite, Detalhes em Laranja e Branco) -->
    <div id="telaAbertura" class="fixed inset-0 bg-zinc-950 z-50 flex flex-col items-center justify-center text-white transition-opacity duration-700 border-t-8 border-orange-500">
        <div class="text-center p-6 max-w-md">
            <div class="text-6xl mb-4">⏱</div>
            <h1 class="text-3xl font-extrabold mb-2 tracking-wide">HITECH <span class="text-orange-500">INFORMÁTICA</span></h1>
            <p class="text-gray-400 text-sm mb-8 uppercase tracking-wider font-medium">Controle de Assistência Técnica & Ponto</p>
            <button onclick="entrarSistema()" class="bg-orange-500 hover:bg-orange-600 text-white font-bold px-8 py-3.5 rounded-xl shadow-lg transition transform hover:scale-105 uppercase tracking-wider text-sm border border-orange-400">
                Acessar Sistema
            </button>
        </div>
    </div>

    <!-- Conteúdo Principal do Sistema -->
    <div id="conteudoSistema" class="container mx-auto p-4 max-w-full opacity-0 transition-opacity duration-500">
        <!-- Cabeçalho com Contadores Dinâmicos -->
        <header class="flex flex-col md:flex-row justify-between items-center mb-6 bg-white p-4 rounded-lg shadow gap-4 border-l-4 border-orange-500">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">HiTech Informática - Controle de Assistência</h1>
                <div class="flex flex-wrap gap-4 mt-2 text-sm text-gray-600">
                    <p>Entrada: <span id="contadorEntrada" class="font-bold text-blue-600 bg-blue-50 px-2 py-0.5 rounded">0</span></p>
                    <p>Bancada: <span id="contadorBancada" class="font-bold text-orange-600 bg-orange-50 px-2 py-0.5 rounded">0</span></p>
                    <p>Aguardando: <span id="contadorAguardando" class="font-bold text-amber-600 bg-amber-50 px-2 py-0.5 rounded">0</span></p>
                    <p>Enviados: <span id="contadorEnviados" class="font-bold text-purple-600 bg-purple-50 px-2 py-0.5 rounded">0</span></p>
                </div>
            </div>
            <button onclick="abrirModal()" class="bg-orange-500 text-white px-4 py-2 rounded-lg hover:bg-orange-600 transition w-full md:w-auto font-medium shadow">
                + Nova OS
            </button>
        </header>

        <!-- Abas de Navegação e Busca -->
        <div class="mb-6 flex flex-col md:flex-row justify-between items-center gap-4 bg-white p-4 rounded-lg shadow">
            <div class="flex gap-2 w-full md:w-auto overflow-x-auto pb-2 md:pb-0">
                <button id="btnAbaEntrada" onclick="mudarAba('ENTRADA')" class="flex-1 md:flex-none px-3 py-2 rounded-lg font-semibold text-sm transition bg-orange-500 text-white whitespace-nowrap shadow-sm">
                    📥 Entrada
                </button>
                <button id="btnAbaBancada" onclick="mudarAba('BANCADA')" class="flex-1 md:flex-none px-3 py-2 rounded-lg font-semibold text-sm transition bg-gray-200 text-gray-700 hover:bg-gray-300 whitespace-nowrap shadow-sm">
                    🛠️ Bancada
                </button>
                <button id="btnAbaAguardando" onclick="mudarAba('AGUARDANDO')" class="flex-1 md:flex-none px-3 py-2 rounded-lg font-semibold text-sm transition bg-gray-200 text-gray-700 hover:bg-gray-300 whitespace-nowrap shadow-sm">
                    ⏳ Aguardando
                </button>
                <button id="btnAbaEnviado" onclick="mudarAba('ENVIADO')" class="flex-1 md:flex-none px-3 py-2 rounded-lg font-semibold text-sm transition bg-gray-200 text-gray-700 hover:bg-gray-300 whitespace-nowrap shadow-sm">
                    📤 Enviado
                </button>
                <button id="btnAbaFinalizadas" onclick="mudarAba('FINALIZADO')" class="flex-1 md:flex-none px-3 py-2 rounded-lg font-semibold text-sm transition bg-gray-200 text-gray-700 hover:bg-gray-300 whitespace-nowrap shadow-sm">
                    ✅ Finalizados
                </button>
            </div>
            <div class="w-full md:w-80">
                <input type="text" id="inputBusca" placeholder="Pesquisar por Empresa, OS, Serial ou Contato..." onkeyup="filtrarDados()" class="w-full p-2 border rounded-lg bg-white text-sm focus:ring-2 focus:ring-orange-500 outline-none">
            </div>
        </div>

        <!-- Tabela Dinâmica (Desktop) -->
        <div class="bg-white rounded-lg shadow overflow-hidden hidden md:block">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200 text-xs">
                    <thead id="tabelaCabecalho" class="bg-gray-50 text-gray-700 uppercase">
                        <!-- Cabeçalho dinâmico gerado via JS -->
                    </thead>
                    <tbody id="tabelaCorpo" class="divide-y divide-gray-200 text-gray-600">
                        <!-- Dados carregados via JS -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Cards (Mobile) -->
        <div id="cardsMobile" class="grid grid-cols-1 gap-4 md:hidden">
            <!-- Cards carregados via JS -->
        </div>
    </div>

    <!-- Modal de Cadastro / Edição -->
    <div id="modalOS" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl max-w-xl w-full p-6 shadow-2xl max-h-[90vh] overflow-y-auto border-t-4 border-orange-500">
            <h2 id="modalTitulo" class="text-xl font-bold text-gray-800 mb-4 pb-2 border-b">Nova Ordem de Serviço</h2>
            <form id="formOS" onsubmit="salvarOS(event)" class="space-y-4">
                <input type="hidden" id="osId">
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold uppercase text-gray-700 mb-1">Empresa *</label>
                        <input type="text" id="empresa" required class="w-full p-2.5 border-2 rounded-lg text-sm bg-gray-50 focus:bg-white focus:border-orange-500 outline-none transition">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-gray-700 mb-1">Contato</label>
                        <input type="text" id="contato" class="w-full p-2.5 border-2 rounded-lg text-sm bg-gray-50 focus:bg-white focus:border-orange-500 outline-none transition">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-bold uppercase text-gray-700 mb-1">Nº OS *</label>
                        <input type="text" id="numOs" required class="w-full p-2.5 border-2 rounded-lg text-sm bg-gray-50 focus:bg-white focus:border-orange-500 outline-none transition font-mono">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-gray-700 mb-1">Serial *</label>
                        <input type="text" id="serial" required class="w-full p-2.5 border-2 rounded-lg text-sm bg-gray-50 focus:bg-white focus:border-orange-500 outline-none transition font-mono">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-gray-700 mb-1">Modelo *</label>
                        <select id="modelo" required class="w-full p-2.5 border-2 rounded-lg bg-gray-50 focus:bg-white focus:border-orange-500 outline-none transition text-sm font-semibold text-gray-800">
                            <option value="">Selecione</option>
                            <option value="IDCLASS">IDCLASS</option>
                            <option value="IDFACE">IDFACE</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold uppercase text-gray-700 mb-1">Defeito Relatado</label>
                        <textarea id="defeito" rows="2" class="w-full p-2.5 border-2 rounded-lg text-sm bg-gray-50 focus:bg-white focus:border-orange-500 outline-none transition"></textarea>
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-gray-700 mb-1">Diagnóstico Técnico</label>
                        <textarea id="diagnostico" rows="2" class="w-full p-2.5 border-2 rounded-lg text-sm bg-gray-50 focus:bg-white focus:border-orange-500 outline-none transition"></textarea>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 bg-gray-50 p-3 rounded-xl border border-gray-200">
                    <div>
                        <label class="block text-xs font-bold uppercase text-gray-700 mb-1">Data de Entrada *</label>
                        <input type="date" id="dataEntrada" required class="w-full p-2.5 border-2 rounded-lg text-sm bg-white focus:border-orange-500 outline-none transition">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-gray-700 mb-1">Status Atual</label>
                        <select id="status" class="w-full p-2.5 border-2 rounded-lg bg-white focus:border-orange-500 outline-none transition text-sm font-bold text-gray-800">
                            <option value="ENTRADA">Entrada</option>
                            <option value="BANCADA">Bancada</option>
                            <option value="AGUARDANDO">Aguardando</option>
                            <option value="ENVIADO">Enviado</option>
                            <option value="FINALIZADO">Finalizado</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase text-gray-700 mb-1">Observações Gerais</label>
                    <textarea id="observacao" rows="3" placeholder="Informações adicionais relevantes..." class="w-full p-2.5 border-2 rounded-lg text-sm bg-gray-50 focus:bg-white focus:border-orange-500 outline-none transition"></textarea>
                </div>

                <div class="flex justify-end gap-3 pt-4 border-t">
                    <button type="button" onclick="fecharModal()" class="px-5 py-2.5 border rounded-xl text-gray-600 hover:bg-gray-100 font-medium text-sm transition">Cancelar</button>
                    <button type="submit" class="px-6 py-2.5 bg-orange-500 text-white rounded-xl hover:bg-orange-600 font-bold text-sm shadow transition">Salvar Ordem</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal de Histórico do Aparelho (Linha do Tempo) -->
    <div id="modalHistorico" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl max-w-2xl w-full p-6 shadow-2xl max-h-[90vh] overflow-y-auto border-t-4 border-orange-500">
            <div class="flex justify-between items-center mb-4 pb-2 border-b">
                <h2 class="text-xl font-bold text-gray-800">Histórico do Aparelho (Linha do Tempo)</h2>
                <button onclick="fecharModalHistorico()" class="text-gray-500 hover:text-gray-800 font-bold text-lg px-2">✕</button>
            </div>
            <div id="conteudoHistorico" class="space-y-4">
                <!-- Preenchido via JS -->
            </div>
            <div class="flex justify-end pt-4 border-t mt-4">
                <button type="button" onclick="fecharModalHistorico()" class="px-5 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 font-medium text-sm transition">Fechar</button>
            </div>
        </div>
    </div>

    <!-- Div para estruturar a Etiqueta de Impressão de Bancada -->
    <div id="etiquetaImpressao" style="display:none;"></div>

    <!-- Script de Integração Firebase e Lógica -->
    <script type="module" src="app.js"></script>
</body>
</html>

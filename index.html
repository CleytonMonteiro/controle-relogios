<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Relógios na Assistência</title>
    <!-- Tailwind CSS para design responsivo -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

    <div class="container mx-auto p-4 max-w-7xl">
        <!-- Cabeçalho -->
        <header class="flex flex-col md:flex-row justify-between items-center mb-6 bg-white p-4 rounded-lg shadow gap-4">
            <h1 class="text-2xl font-bold text-gray-800">Controle de Relógios - Assistência</h1>
            <button onclick="abrirModal()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition w-full md:w-auto">
                + Nova OS
            </button>
        </header>

        <!-- Filtros e Busca -->
        <div class="mb-6 flex flex-col md:flex-row gap-4">
            <input type="text" id="inputBusca" placeholder="Pesquisar por Empresa, OS ou Serial..." onkeyup="filtrarDados()" class="p-2 border rounded-lg flex-1 bg-white">
            <select id="filtroStatus" onchange="filtrarDados()" class="p-2 border rounded-lg bg-white">
                <option value="">Todos os Status</option>
                <option value="ANDAMENTO">Em Andamento</option>
                <option value="FINALIZADO">Finalizado</option>
            </select>
        </div>

        <!-- Tabela (Visível apenas em Desktop/Tablets largos) -->
        <div class="bg-white rounded-lg shadow overflow-hidden hidden md:block">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50 text-xs text-gray-700 uppercase">
                    <tr>
                        <th class="px-4 py-3 text-left">Empresa</th>
                        <th class="px-4 py-3 text-left">Nº OS</th>
                        <th class="px-4 py-3 text-left">Serial</th>
                        <th class="px-4 py-3 text-left">Modelo</th>
                        <th class="px-4 py-3 text-left">Defeito</th>
                        <th class="px-4 py-3 text-left">Entrada</th>
                        <th class="px-4 py-3 text-left">Contato</th>
                        <th class="px-4 py-3 text-left">Status</th>
                        <th class="px-4 py-3 text-center">Ações</th>
                    </tr>
                </thead>
                <tbody id="tabelaCorpo" class="divide-y divide-gray-200 text-sm text-gray-600">
                    <!-- Dados carregados via JS -->
                </tbody>
            </table>
        </div>

        <!-- Cards (Visível em Celulares e Telas Pequenas) -->
        <div id="cardsMobile" class="grid grid-cols-1 gap-4 md:hidden">
            <!-- Cards carregados via JS -->
        </div>
    </div>

    <!-- Modal de Cadastro / Edição -->
    <div id="modalOS" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-lg max-w-lg w-full p-6 shadow-xl max-h-[90vh] overflow-y-auto">
            <h2 id="modalTitulo" class="text-xl font-bold text-gray-800 mb-4">Nova Ordem de Serviço</h2>
            <form id="formOS" onsubmit="salvarOS(event)" class="space-y-4">
                <input type="hidden" id="osId">
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-600 mb-1">Empresa</label>
                    <input type="text" id="empresa" required class="w-full p-2 border rounded-lg">
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold uppercase text-gray-600 mb-1">Nº OS</label>
                        <input type="text" id="numOs" required class="w-full p-2 border rounded-lg">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-gray-600 mb-1">Número de Série (Serial)</label>
                        <input type="text" id="serial" required class="w-full p-2 border rounded-lg">
                    </div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold uppercase text-gray-600 mb-1">Modelo</label>
                        <select id="modelo" required class="w-full p-2 border rounded-lg bg-white">
                            <option value="">Selecione o Modelo</option>
                            <option value="IDCLASS">IDCLASS</option>
                            <option value="IDFACE">IDFACE</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-gray-600 mb-1">Data de Entrada</label>
                        <input type="date" id="dataEntrada" required class="w-full p-2 border rounded-lg">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-600 mb-1">Defeito Relatado</label>
                    <textarea id="defeito" rows="2" class="w-full p-2 border rounded-lg"></textarea>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold uppercase text-gray-600 mb-1">Contatos (Telefone/Resp.)</label>
                        <input type="text" id="contatos" class="w-full p-2 border rounded-lg">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-gray-600 mb-1">Status</label>
                        <select id="status" class="w-full p-2 border rounded-lg bg-white">
                            <option value="ANDAMENTO">Em Andamento</option>
                            <option value="FINALIZADO">Finalizado</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-600 mb-1">Observação</label>
                    <input type="text" id="observacao" class="w-full p-2 border rounded-lg">
                </div>

                <div class="flex justify-end gap-2 pt-4 border-t">
                    <button type="button" onclick="fecharModal()" class="px-4 py-2 border rounded-lg text-gray-600 hover:bg-gray-50">Cancelar</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script de Integração Firebase e Lógica -->
    <script type="module" src="app.js"></script>
</body>
</html>
